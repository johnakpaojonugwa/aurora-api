services:
  # Redis Instance
  - type: redis
    name: aurora-redis
    plan: free  # Upgrade to starter for production
    ipAllowList: []  # Internal-only access (more secure)
    maxmemoryPolicy: allkeys-lru  # Recommended for caching

  # NestJS Backend Web Service
  - type: web
    name: aurora-backend
    runtime: node
    plan: free  # Upgrade to starter for production
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health  # Important for free tier to prevent spin-down
    
    envVars:
      # Server Configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      
      # Frontend CORS
      - key: CORS_ORIGINS
        value: https://aurora-frontend.onrender.com,http://localhost:3000
      
      # Database (PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: aurora-db
          property: connectionString
      
      # Redis Connection
      - key: REDIS_URL
        fromService:
          type: redis
          name: aurora-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: aurora-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: aurora-redis
          property: port
      
      # JWT Secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      
      # JWT Expirations
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      
      # Email
      - key: RESEND_API_KEY
        sync: false
      
      # Payment Providers
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      
      # Monitoring
      - key: SENTRY_DSN
        sync: false
      
      # Feature Flags
      - key: ENABLE_PAYMENT
        value: true
      - key: ENABLE_EMAIL
        value: true

databases:
  - name: aurora-db
    plan: free  # Upgrade to starter for production
    databaseName: aurora_db
    user: aurora_user
    ipAllowList: []  # Only allow internal connections

# Optional: Add a cron job for scheduled tasks
# - type: cron
#   name: order-cleanup
#   schedule: "0 0 * * *"  # Daily at midnight
#   command: npm run cleanup:orders